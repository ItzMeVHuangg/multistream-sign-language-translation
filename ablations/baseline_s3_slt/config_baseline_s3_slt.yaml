base_config: ../../configs/config.yaml

baseline_s3:
  name: "baseline_s3_only_slt"
  stream3_ckpt: "checkpoints/stream3_only/best_stream3.pth"
  output_dir: "checkpoints/ablations/baseline_s3_slt"
  log_dir: "logs/ablations/baseline_s3_slt"
  train_gloss_source: "predicted"      # match evaluation/deployed input distribution
  eval_gloss_source: "predicted"       # full S3-only CSLR -> SLT baseline
  decode_mode: "greedy"
  beam_width: 1
  sample_predictions: 3

data:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true

llm:
  max_gen_length: 64

ensemble:
  # Not used by the baseline model, kept here only for experiment traceability.
  stream_weights: [0.0, 0.0, 1.0]

slt:
  learning_rate: 1.0e-5
  warmup_steps: 500
