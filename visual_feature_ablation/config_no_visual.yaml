base_config: ../configs/config.yaml

main_pipeline:
  name: "rover_main_cslr_slt_no_visual"
  stream1_ckpt: "checkpoints/stream1_only/best_stream1.pth"
  stream2_ckpt: "checkpoints/stream2_only/best_stream2.pth"
  stream3_ckpt: "checkpoints/stream3_only/best_stream3.pth"
  output_dir: "checkpoints/visual_feature_ablation/no_visual"
  log_dir: "logs/visual_feature_ablation/no_visual"
  train_gloss_source: "rover"
  eval_gloss_source: "rover"
  visual_sources: ["s1", "s2", "s3"]
  visual_target: "s3"
  visual_weights: [1.0, 0.3, 1.0]
  disable_visual_features: true
  slt_beam_width: 4
  sample_predictions: 3

three_stream:
  share_swin: false
  primary_output: "rover"

ensemble:
  beam_width: 1
  lm_weight: 0.0
  use_lm: false
  stream_weights: [1.0, 0.3, 1.0]

data:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true

slt:
  learning_rate: 1.0e-5
  warmup_steps: 500
  llm_trainable_modules:
    - "encoder_attn"
    - "self_attn"
    - "fc"
    - "visual_adapter"
    - "visual_prefix"
    - "prefix_cross_attn"
    - "prefix_norm"
    - "lm_head"

llm:
  max_gen_length: 64
  num_beams: 4
  no_repeat_ngram_size: 2
  repetition_penalty: 1.25
  length_penalty: 1.0
