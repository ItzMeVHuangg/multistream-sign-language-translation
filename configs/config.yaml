# --------- REPRODUCIBILITY ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------

# --------- PATHS ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
paths:
  phoenix_root:         "/datastore/cndt_phungdtm/KLTN_HoangBinh/Dataset/PHOENIX-2014-T"
  frames_root:          "/datastore/cndt_phungdtm/KLTN_HoangBinh/Dataset/PHOENIX-2014-T/features/fullFrame-210x260px"
  annot_root:           "/datastore/cndt_phungdtm/KLTN_HoangBinh/Dataset/PHOENIX-2014-T/annotations/manual"
  mediapipe_kpts_root:  "/datastore/cndt_phungdtm/KLTN_HoangBinh/Dataset/PHOENIX-2014-T/keypoints"
  checkpoint_dir:       "checkpoints"
  log_dir:              "logs"

# --------- DATA ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
data:
  img_height: 224              
  img_width:  224

  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  multiprocessing_context: "spawn"

  max_frames: 256
  temporal_stride: 1

  augmentation:
    random_crop: true
    horizontal_flip: 0.5
    temporal_scale:
      min_scale: 0.8
      max_scale: 1.2


# --------- VISUAL ENCODERS ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------

cnn:
  backbone: "resnet34"
  pretrained: true
  freeze_bn: false
  out_features: 512            

cnn_3d:
  backbone: "r3d_18"
  pretrained: true
  out_features: 512
  clip_len: 16                 
  clip_stride: 8              

video_swin:
  backbone: "swin3d_t"
  pretrained: true
  out_features: 512
  clip_len: 16                 
  clip_stride: 8               
  max_clips_per_fwd: 4
mediapipe:
  keypoint_dim: 225
  hidden_dim: 256
  out_features: 512
  num_tcn_layers: 4
  tcn_kernel: 3
  dropout: 0.2


# --------- SEQUENCE MODELS ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------

bilstm:
  hidden_size: 512
  num_layers: 2
  dropout: 0.3
  projection_size: 256

transformer_ctc:
  d_model: 512                 
  nhead: 8                    
  num_layers: 4                
  dim_feedforward: 2048
  dropout: 0.3
  projection_size: 256

conformer:
  d_model: 512
  nhead: 8
  num_layers: 6
  conv_kernel_size: 31         
  ff_expansion_factor: 4
  attn_dropout: 0.1
  conv_dropout: 0.1
  ff_dropout: 0.1
  projection_size: 256


# --------- CSLR TRAINING ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
cslr:
  ctc_blank_idx: 0

  hidden_size: 512             
  projection_size: 256        

  batch_size: 4
  grad_accumulation_steps: 1  

  num_epochs: 50

  learning_rate: 5.0e-4
  lr_scheduler: "step"         
  lr_decay_rate: 0.2          
  lr_decay_epochs: [40, 50]  
  warmup_epochs: 0             
  eta_min: 1.0e-6

  weight_decay: 5.0e-4
  gradient_clip: 5.0

  encoder_lr_scale: 0.1      

  use_amp: true

  beam_width: 4                # giảm beam khi train để tiết kiệm thời gian

  early_stopping:
    enabled: false           
    patience: 15
    metric: "WER"

  freeze_backbone:
    enabled: false
    freeze_epochs: 0


# --------- 3-STREAM ARCHITECTURE ---------------------------------------------------------------------------------------------------------------------------------------------------------

stream1:                         # RGB-USTM adapted (Swin3D-T + TAPE + temporal refinement)
  pretrained: true
  d_model: 512
  tape_kernel: 3
  tape_dilation_short: 1         # short-range TAPE after Stage 1
  tape_dilation_long: 3          # long-range TAPE after Stage 3
  tape_max_len: 512
  tape_dropout: 0.1
  temporal_dropout: 0.1
  temporal_lstm_layers: 1
  ctc_dropout: 0.1
  use_checkpoint: true           # gradient checkpointing (saves ~40% VRAM)

stream2:                         # Hypergraph Skeleton
  keypoint_dim: 225              # 75 joints -- 3 (x,y,z)
  num_joints: 75
  keypoint_layout: "pose_hands"   # extract_mediapipe_fast.py saves pose(33) before hands(42)
  node_dim: 128
  d_model: 512
  cgp_channels: [64, 128, 128, 256] # HyperSign-lite CGP stages
  num_proto: 8                   # semantic prototype hyperedges
  knn_k: 8                       # k for KNN geometric hyperedges
  ms_kernels: [1, 3, 5, 7]       # multi-scale temporal conv kernels
  dropout: 0.1
  ctc_dropout: 0.1
  learning_rate: 5.0e-4          # stream2 is trained from scratch; do not use joint stream2_lr_scale
  normalize_keypoints: true      # center/scale each skeleton frame before hypergraph
  temporal_lstm_layers: 1        # adds long-range context for CTC decoding

stream3:                         # Cross-Attention Fusion (novel)
  keypoint_dim: 225
  d_model: 512
  nhead: 8
  bilstm_hidden: 512
  bilstm_layers: 2
  attn_dropout: 0.1
  bilstm_dropout: 0.3
  ctc_dropout: 0.1
  pretrained: true
  use_checkpoint: true

three_stream:                    # Joint training settings
  share_swin: false              # keep Stream 3's own Swin checkpoint for fusion-only joint training
  batch_size: 2
  grad_accumulation_steps: 4    # effective batch = 8 on A100 80GB
  num_epochs: 100
  learning_rate: 3.0e-5
  warmup_epochs: 1
  eta_min: 1.0e-6
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  use_amp: true
  swin_lr_scale: 0.05            # Swin backbone lr = base_lr -- 0.05
  stream2_lr_scale: 0.5          # train stream2, but more conservatively than new fusion heads
  freeze_stream2: false
  freeze_streams_for_fusion: true # keep pretrained single-stream checkpoints fixed in joint training
  fusion_ctc_weight: 1.0          # train the differentiable fused CTC output
  monitor: "fused"               # early stopping should track the trainable joint output
  # per-stream CTC loss weights (0 when only learning the fusion weights)
  loss_weights: [0.0, 0.0, 0.0]
  early_stopping:
    enabled: true
    patience: 12
    metric: "WER"

ensemble:
  beam_width: 1
  lm_weight: 0.0
  use_lm: false
  stream_weights: [1.0, 0.3, 1.0]  # keep all three streams; down-weight weaker stream2 in voting

# --------- FUSION ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
fusion:
  mode: "attention"            
  gloss_embed_dim: 256
  fused_dim: 512
  dropout: 0.2
  nhead: 8                    
slt:
  batch_size: 2
  num_epochs: 25

  learning_rate: 3.0e-5
  lr_scheduler: "cosine"
  warmup_steps: 1000
  eta_min: 1.0e-7

  weight_decay: 1.0e-4
  label_smoothing: 0.1
  gradient_clip: 1.0
  use_amp: true
  grad_accumulation_steps: 4

  d_model: 512
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 128

  early_stopping:
    enabled: true
    patience: 8
    metric: "BLEU-4"

  llm_trainable_modules:
    - "cross_attention"
    - "encoder_attn"
    - "self_attn"
    - "visual_adapter"
    - "lm_head"
    - "visual_prefix"
    - "prefix_cross_attn"


# --------- SLT DECODER ARCHITECTURES ---------------------------------------------------------------------------------------------------------------------------------------------

transformer_2d:
  d_model: 512
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 128

transformer_3d:
  d_model: 512
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  max_seq_len: 128
  temporal_kernel: 3

llm:
  model_name: "facebook/mbart-large-50"
  src_lang: "de_DE"
  tgt_lang: "de_DE"
  freeze_encoder: true
  visual_prefix_len: 32
  adapter_hidden: 768
  max_gen_length: 128
  num_beams: 4
  label_smoothing: 0.1


# --------- HYPERPARAMETER OPTIMIZATION ---------------------------------------------------------------------------------------------------------------------------------------
hpo:
  sampler: "tpe"
  pruner: "hyperband"
  timeout: 36000
  search_space:
    learning_rate: [1.0e-5, 5.0e-4]
    hidden_size: [256, 512, 768]
    num_layers: [2, 3, 4]
    dropout: [0.1, 0.5]
    batch_size: [1, 2]
    weight_decay: [1.0e-5, 1.0e-3]


# --------- EVALUATION ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
eval:
  cslr_metric: "WER"
  slt_metrics: ["BLEU-4", "ROUGE-L", "METEOR"]
  beam_width: 4
  use_oracle_gloss_in_eval: false   
